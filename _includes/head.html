<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>{% if page.title and page.url != "/" %}{{ page.title }} · {% endif %}{{ site.title }}</title>
{% assign desc = page.summary | default: site.description | strip_newlines | strip_html %}
<meta name="description" content="{{ desc | escape }}">
<meta property="og:title" content="{% if page.title %}{{ page.title | escape }}{% else %}{{ site.title }}{% endif %}">
<meta property="og:description" content="{{ desc | escape }}">
<meta property="og:type" content="website">
<meta property="og:url" content="{{ page.url | absolute_url }}">
{% if page.cover %}<meta property="og:image" content="{{ '/assets/projects/' | append: page.slug | append: '/' | append: page.cover | absolute_url }}">
<meta name="twitter:card" content="summary_large_image">{% endif %}
<meta name="theme-color" content="#060809">
<link rel="icon" href="{{ '/assets/favicon.svg' | relative_url }}" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,300..900&family=IBM+Plex+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="{{ '/assets/css/site.css' | relative_url }}">
<script src="{{ '/assets/js/site.js' | relative_url }}" defer></script>
